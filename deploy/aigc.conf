# ============================================================================
# aigc.conf — Nginx 前后端一体配置
#
# 部署结构：
#   前端 SPA（Vue）  → /usr/share/nginx/html
#   后端 Spring Boot → 127.0.0.1:8080
#   反向代理：/api/** /sse /mcp/** /files/** → 后端
#
# 复制到服务器: cp aigc.conf /etc/nginx/conf.d/
# ============================================================================

upstream aigc_backend {
    server 127.0.0.1:9900;
    keepalive 32;
}

server {
    # --- 监听 ---
    listen       80;
    listen       [::]:80;
    server_name  _;                          # 接受任意 IP / 域名（公网部署时可改具体域名）

    # --- 前端静态根目录 ---
    root         /usr/share/nginx/html;
    index        index.html;

    # --- 上传上限（匹配后端 50MB + 余量） ---
    client_max_body_size 80m;
    client_body_timeout 120s;

    # ================= 1. 前端 SPA =================
    # 所有非 API 请求走 index.html，Vue Router 接管
    location / {
        try_files $uri $uri/ /index.html;

        # Vite 产物带 [hash]，可强缓存 30 天
        location ~* \.(js|css|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        # 图片资源（可能被用户替换，缓存短一点）
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
    }

    # ================= 2. 后端 REST API =================
    location /api/ {
        proxy_pass http://aigc_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 必须带上公网端口，否则后端按 9900 计算请求地址，和浏览器 Origin 不一致
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ================= 3. SSE 实时事件流（画布 WebSocket） =================
    # 后端 Spring AI MCP 用 GET /sse 建长连接 + POST /mcp/message 发消息
    # 这里处理的是画布前端的 /sse（WebSocket upgrade）
    location /sse {
        proxy_pass http://aigc_backend/sse;
        proxy_http_version 1.1;

        # SSE / WebSocket 必须的头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # ⚠️ SSE 长连接超时必须设大！后端轮询任务可能 15 分钟
        proxy_read_timeout  900s;
        proxy_send_timeout  900s;

        # 禁止 Nginx buffer，否则 SSE 逐条推送会被吞
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering no;
    }

    # ================= 3b. WebSocket（画布实时事件推送） =================
    # 前端 connectRealtime() 连的是 /ws/canvas/{workspaceId}
    location /ws/ {
        proxy_pass http://aigc_backend/ws/;
        proxy_http_version 1.1;

        # WebSocket 握手必须的头
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 握手校验同源时要用公网端口，缺这一行会返回 403
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout  900s;
        proxy_send_timeout  900s;
        proxy_buffering     off;
    }

    # ================= 4. MCP 端点（AI Agent 接入） =================
    location /mcp/ {
        proxy_pass http://aigc_backend/mcp/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # ================= 5. 静态资源（AssetService 映射） =================
    # /files/images/**  /files/videos/**  后端本地存储 + MinIO/COS/OSS 签名 URL
    location /files/ {
        proxy_pass http://aigc_backend/files/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # 视频 Range 请求（前端拖拽进度条、倍速播放）
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # 不要缓存（刚生成的视频可能还在转存）
        proxy_cache off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ================= 6. 健康检查（可选，供负载均衡器探测） =================
    location /actuator/health {
        proxy_pass http://aigc_backend/actuator/health;
        access_log off;
    }

    # ================= 7. 安全头 =================
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    # 公网 HTTPS 部署时建议启用（需要后端同步开 secure cookie）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # ================= 8. 日志 =================
    access_log  /var/log/nginx/aigc.access.log  main;
    error_log   /var/log/nginx/aigc.error.log;
}
