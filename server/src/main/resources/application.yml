server:
  port: 8080
  # 经 Nginx / 网关反向代理时，按 X-Forwarded-* 生成正确的 HTTPS 外链
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: AIGCSESSION
        http-only: true
        same-site: strict
        secure: ${AIGC_COOKIE_SECURE:false}

spring:
  application:
    name: aigc-video-server
  datasource:
    # 默认使用 H2 文件库，开箱即跑；生产用 --spring.profiles.active=mysql
    url: jdbc:h2:file:./data/aigc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      # 公网部署不开放数据库控制台；本地排障时再通过环境变量显式开启
      enabled: ${AIGC_H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 无密码时留空即可
      password: ${REDIS_PASSWORD:}
      # 使用的数据库编号（0-15），默认 0
      database: ${REDIS_DATABASE:10}
      # Redis 不可用时快速失败，回退到单实例本地广播
      timeout: 800ms
      connect-timeout: 800ms
  task:
    scheduling:
      pool:
        # 转存成片时会有网络下载，留出并发避免阻塞其它任务的轮询
        size: 2
  ai:
    mcp:
      server:
        name: aigc-canvas
        version: 0.1.0
        # 当前 Spring AI 版本的 WebMVC 传输为 SSE：
        # GET /sse 建流（返回 sessionId），POST /mcp/message?sessionId=xxx 发 JSON-RPC
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

aigc:
  security:
    # 单租户管理员；公网部署必须显式配置，不提供默认密码
    admin-username: ${AIGC_ADMIN_USERNAME:admin}
    admin-password: ${AIGC_ADMIN_PASSWORD:admin@888}
    # MCP 独立凭证，至少 32 个字符，与网页登录密码分开管理
    mcp-token: ${MCP_API_TOKEN:10cf1fdf6ad958eeffa9853f6885cec9}
    cookie-secure: ${AIGC_COOKIE_SECURE:false}
    # 可选的跨域前端 / WebSocket 来源，多个用英文逗号分隔；同源部署留空
    allowed-origins: ${AIGC_ALLOWED_ORIGINS:}
  session:
    # 多实例共享登录态：true 时 Session 写入 Redis（各实例需连同一个 Redis）；
    # 单实例保持 false，沿用容器内存 Session，无需 Redis 也能登录
    redis-enabled: ${AIGC_SESSION_REDIS_ENABLED:false}
  realtime:
    # 多实例部署置 true：画布事件走 Redis Pub/Sub，跨实例推送；
    # 同时启用任务调度的分布式锁，避免多个实例重复扫描任务表
    redis-enabled: ${AIGC_REDIS_ENABLED:false}
  provider:
    # mock = 无需任何密钥即可跑通全链路；seedance = 火山方舟即梦
    default-name: ${AIGC_PROVIDER:seedance}
    mock:
      # 演示成片（Mock 不产生真实视频，成功后直接给这个地址）
      video-url: https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4
      seconds: 8
    seedance:
      base-url: https://ark.cn-beijing.volces.com/api/v3
      api-key: ${ARK_API_KEY:}
      model: ${ARK_MODEL:doubao-seedance-2-0-260128}
      ratio: "16:9"
      duration: 5
      watermark: false
  storage:
    # local = 本地磁盘 + /files；minio = MinIO；cos = 腾讯云 COS；oss = 阿里云 OSS
    type: ${AIGC_STORAGE_TYPE:local}
    local-dir: ./data/files
    public-prefix: /files
    # 私有对象存储签名 URL 有效期；数据库只保存稳定 URL
    signed-url-ttl-seconds: ${AIGC_SIGNED_URL_TTL_SECONDS:3600}
    minio:
      endpoint: http://127.0.0.1:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: aigc
    # 腾讯云 COS：type=cos 时生效
    cos:
      # 访问域名，如 https://aigc-1250000000.cos.ap-guangzhou.myqcloud.com
      endpoint: ${COS_ENDPOINT:}
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      bucket: ${COS_BUCKET:}
      region: ${COS_REGION:ap-guangzhou}
      # 可选：CDN / 自定义域名，配置后优先用于拼接访问地址
      public-url: ${COS_PUBLIC_URL:}
    # 阿里云 OSS：type=oss 时生效
    oss:
      # 地域节点，如 https://oss-cn-hangzhou.aliyuncs.com
      endpoint: ${OSS_ENDPOINT:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      bucket: ${OSS_BUCKET:}
      # 可选：CDN / 自定义域名，配置后优先用于拼接访问地址
      public-url: ${OSS_PUBLIC_URL:}
  poll-timeout-seconds: 900
  # AI 生成：分镜脚本（LLM）与图片；api-key 为空时走 mock
  ai:
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    api-key: ${ARK_API_KEY:}
    script-model: ${ARK_SCRIPT_MODEL:doubao-seed-1-6-250615}
    image-model: ${ARK_IMAGE_MODEL:doubao-seedream-3-0-t2i-250415}

logging:
  level:
    com.aigc.video: info
