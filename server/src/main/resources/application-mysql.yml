spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/aigc_video?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always
      # 建表脚本含中文字段注释，显式指定 UTF-8，避免按平台编码读取导致注释乱码
      encoding: UTF-8
      schema-locations: classpath:db/schema-mysql.sql
